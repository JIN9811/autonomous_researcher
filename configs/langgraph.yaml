# File purpose:
# - Graph node and transition metadata for LangGraph runtime introspection.
#
# Key classes/functions:
# - Mirrors graphs/configs/atr_closed_loop.yaml for lightweight GUI/runtime panels.
#
# Inputs/outputs:
# - Input: ordered stage list and transition hints
# - Output: graph metadata
#
# Dependencies:
# - graphs/configs/atr_closed_loop.yaml
#
# Modification guide:
# - Safe places to edit: stage descriptions
# - Risky places to edit: node ids mismatched with runtime stage enums
# - Related files: orchestrator/state.py, graphs/configs/atr_closed_loop.yaml

graph:
  id: atr_closed_loop
  runtime: langgraph
  config_path: graphs/configs/atr_closed_loop.yaml
  nodes:
    - design
    - specimen
    - vision
    - manipulation
    - equipment
    - analysis
    - knowledge
    - bo
    - guardian
  transitions:
    idle: design
    design: specimen
    specimen: vision
    vision: manipulation
    manipulation: equipment
    equipment: analysis
    analysis: knowledge
    knowledge: bo
    bo: guardian
    guardian_continue: design
    guardian_stop: complete
    guardian_error: error
