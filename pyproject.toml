[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-researcher"
version = "0.1.0"
description = "Local-first OpenClaw/NemoClaw-inspired multi-agent autonomous researcher framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "langgraph>=0.2.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "numpy>=1.26.0",
  "scikit-image>=0.23.0",
  "trimesh>=4.4.0",
  "botorch>=0.17.0",
  "gpytorch>=1.14.0",
  "piper-tts>=1.4.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "selenium>=4.44.0",
  "ruff>=0.6.0",
]
bo = [
  # Kept for compatibility with older setup notes; BoTorch is now part of the default dependencies.
  "botorch>=0.17.0",
  "gpytorch>=1.14.0",
]
graph = [
  "neo4j>=5.28.0",
  "networkx>=3.2.0",
  "graphifyy==0.4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
