[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-researcher"
version = "0.1.0"
description = "Local-first OpenClaw/NemoClaw-inspired multi-agent autonomous researcher framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "langgraph>=0.2.0",
  "pyyaml>=6.0.0",
  "httpx>=0.27.0",
  "json-repair>=0.50,<1",
  "python-dotenv>=1.0.0",
  "jinja2>=3.1.0",
  "numpy>=1.26.0",
  "matplotlib>=3.8.0",
  "scipy>=1.12.0",
  "pyarrow>=16.0.0",
  "h5py>=3.11.0",
  "Pillow>=10.0.0",
  "scikit-image>=0.23.0",
  "trimesh>=4.4.0",
  "botorch>=0.17.0",
  "gpytorch>=1.14.0",
  "piper-tts>=1.4.2",
  "paho-mqtt>=2.1.0",
  "pyrealsense2==2.58.2.10647",
  "PyAutoGUI>=0.9.54",
  "python3-xlib>=0.15",
  "pynput>=1.7.7,<2",
  "pymcprotocol>=0.3.0,<0.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "selenium>=4.44.0",
  "build>=1.2.2",
  "ruff>=0.6.0",
]
bo = [
  # Kept for compatibility with older setup notes; BoTorch is now part of the default dependencies.
  "botorch>=0.17.0",
  "gpytorch>=1.14.0",
]
graph = [
  "neo4j>=5.28.0",
  "networkx>=3.2.0",
  "graphifyy==0.4.4",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "app*",
  "backends*",
  "device_bridges*",
  "experiments*",
  "graphs*",
  "gui*",
  "knowledge*",
  "learning*",
  "logging_system*",
  "mcp_tools*",
  "memory*",
  "orchestrator*",
  "policies*",
  "reporting*",
  "self_evolution*",
  "submodules*",
  "utils*",
]
exclude = [
  "tests*",
  "docs*",
  "runs*",
  "artifacts*",
  "outputs*",
  "user_files*",
  "image*",
  "models*",
  "install*",
  "patches*",
  "configs*",
  "web*",
  "livegui_package*",
  "Pyautogui_server_for_window*",
  "개선안*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
