graph:
  id: atr_closed_loop
  name: ATR Closed-Loop Autonomous Research Graph
  version: 0.2.0
  entry_node: dispatch
  finish_nodes:
  - step_complete
  nodes:
  - id: dispatch
    label: Runtime Dispatch
    handler: runtime.dispatch
    stage: null
    kind: runtime
    description: Routes the current OrchestratorState stage to the matching executable
      node.
    module_id: null
    position:
      x: 48.0
      y: 208.0
    metadata:
      icon: orchestrator
  - id: idle
    label: Idle
    handler: runtime.idle
    stage: idle
    kind: runtime
    description: Starts one closed-loop cycle by entering the design stage.
    module_id: null
    position:
      x: 48.0
      y: 384.0
    metadata:
      icon: play
  - id: design
    label: Design Agent
    handler: agent.design_agent
    stage: design
    kind: agent
    description: ''
    module_id: modules/design
    position:
      x: 368.0
      y: 240.0
    metadata:
      icon: design_agent
  - id: specimen
    label: Specimen Making Agent
    handler: agent.specimen_agent
    stage: specimen
    kind: agent
    description: ''
    module_id: modules/specimen
    position:
      x: 672.0
      y: 240.0
    metadata:
      icon: specimen_maker
  - id: vision
    label: Vision Agent
    handler: agent.vision_agent
    stage: vision
    kind: agent
    description: ''
    module_id: modules/vision
    position:
      x: 992.0
      y: 240.0
    metadata:
      icon: vision_agent
  - id: manipulation
    label: Manipulation Agent
    handler: agent.manipulation_agent
    stage: manipulation
    kind: agent
    description: ''
    module_id: modules/manipulation
    position:
      x: 1296.0
      y: 240.0
    metadata:
      icon: manipulation_agent
  - id: vision_verify
    label: Vision Verification Agent
    handler: agent.vision_agent
    stage: null
    kind: sidecar
    description: Verify specimen placement after manipulation using BRIO/UTM camera evidence.
    module_id: modules/vision
    position:
      x: 1456.0
      y: 240.0
    metadata:
      icon: vision_agent
      runtime_node: sidecar
      role: post_manipulation_placement_verification
      consumes:
      - robot_task_result.v1
      produces:
      - placement_verification.v1
      - vision_signal.v1
  - id: equipment
    label: Lab Equipment Agent
    handler: agent.equipment_agent
    stage: equipment
    kind: agent
    description: ''
    module_id: modules/equipment
    position:
      x: 1616.0
      y: 384.0
    metadata:
      icon: equipment_agent
  - id: analysis
    label: Analysis Agent
    handler: agent.analysis_agent
    stage: analysis
    kind: agent
    description: ''
    module_id: modules/analysis
    position:
      x: 1296.0
      y: 560.0
    metadata:
      icon: analysis_agent
  - id: knowledge
    label: Knowledge Agent
    handler: agent.knowledge_agent
    stage: knowledge
    kind: agent
    description: ''
    module_id: modules/knowledge
    position:
      x: 992.0
      y: 560.0
    metadata:
      icon: knowledge_agent
  - id: bo
    label: BO Agent
    handler: agent.bo_agent
    stage: bo
    kind: agent
    description: ''
    module_id: modules/bo
    position:
      x: 672.0
      y: 560.0
    metadata:
      icon: bo_agent
  - id: guardian
    label: Guardian Agent
    handler: agent.guardian_agent
    stage: guardian
    kind: agent
    description: ''
    module_id: modules/guardian
    position:
      x: 368.0
      y: 560.0
    metadata:
      icon: guardian_agent
  - id: complete
    label: Complete
    handler: runtime.terminal
    stage: complete
    kind: terminal
    description: ''
    module_id: null
    position:
      x: 48.0
      y: 560.0
    metadata:
      icon: complete
  - id: error
    label: Error
    handler: runtime.terminal
    stage: error
    kind: terminal
    description: ''
    module_id: null
    position:
      x: 48.0
      y: 736.0
    metadata:
      icon: error
  - id: step_complete
    label: Step Complete
    handler: runtime.step_complete
    stage: null
    kind: runtime
    description: ''
    module_id: null
    position:
      x: 368.0
      y: 736.0
    metadata:
      icon: artifact
  - id: orchestrator_supervisor
    label: Orchestrator Supervisor
    handler: agent.orchestrator_agent
    stage: null
    kind: sidecar
    description: Control-plane supervisor that builds mission contracts, orchestration
      plans, and handoff packets for each executable stage.
    module_id: modules/orchestrator
    position:
      x: 368.0
      y: 48.0
    metadata:
      icon: orchestrator
      runtime_node: sidecar
      plane: orchestration_supervisor
      outputs:
      - mission_contract.v1
      - orchestration_plan.v1
      - handoff_packet.v1
      - decision_register.v1
      live_source: orchestrator.supervisor + controller planning_message
  - id: safety_gate_plane
    label: Guardian Safety Gate
    handler: agent.guardian_agent
    stage: null
    kind: sidecar
    description: Graph-wide safety/readiness gate that can hold, stop, retry, or allow
      continuation.
    module_id: modules/guardian
    position:
      x: 992.0
      y: 48.0
    metadata:
      icon: guardian_agent
      runtime_node: sidecar
      plane: guardian_graphwide_gate
      outputs:
      - guardian_report.v1
      - safety_decision.v1
      live_source: /api/guardian/status
  - id: device_bridge_plane
    label: Device Bridge Plane
    handler: runtime.step_complete
    stage: null
    kind: bridge
    description: Hardware/software bridge boundary for printer, robot, UTM/Windows,
      cameras, and CAE/CalculiX tools.
    module_id: null
    position:
      x: 1616.0
      y: 48.0
    metadata:
      icon: device_bridges
      runtime_node: bridge
      plane: device_bridge_plane
      bridges:
      - prusa_bridge
      - lerobot_bridge
      - windows_pyautogui_bridge
      - cae_bridge
      - camera_utm_bridge
      live_source: /api/devices/state
  - id: memory_evidence_plane
    label: Knowledge / Evidence Plane
    handler: agent.knowledge_agent
    stage: null
    kind: evidence_plane
    description: Persistent evidence memory and graph/RAG layer used by Knowledge
      and BO candidate selection.
    module_id: modules/knowledge
    position:
      x: 992.0
      y: 736.0
    metadata:
      icon: knowledge_agent
      runtime_node: evidence
      plane: knowledge_memory_evolution
      outputs:
      - experiment_evidence.v1
      - bo_observation.v1
      - evolution_proposal.v1
      live_source: memory/knowledge + optional Neo4j/Graphify
