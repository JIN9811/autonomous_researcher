    idle: idle
    design: design
    specimen: specimen
    vision: vision
    manipulation: manipulation
    equipment: equipment
    analysis: analysis
    knowledge: knowledge
    bo: bo
    guardian: guardian
    complete: complete
    error: error
  transitions:
    idle: design
    design: specimen
    specimen: vision
    vision: equipment
    manipulation: vision
    equipment: analysis
    analysis: knowledge
    knowledge: bo
    bo: guardian
    guardian: design
  terminal_stages:
  - complete
  - error
  metadata:
    runtime: langgraph
    mode_support:
    - test
    - live
    - replay
    - fault-injection
    safety:
      guardian_required: true
      live_device_dry_run_required_before_execution: true
    runtime_planes:
    - id: orchestration_supervisor
      node_id: orchestrator_supervisor
      source: agents/orchestrator_agent.py + orchestrator/supervisor.py + app/controller.py
      contract:
      - mission_contract.v1
      - orchestration_plan.v1
      - handoff_packet.v1
      - decision_register.v1
    - id: guardian_graphwide_gate
      node_id: safety_gate_plane
      source: policies/guardian_gate.py + agents/guardian_agent.py
      contract:
      - guardian_report.v1
      - safety_decision.v1
    - id: device_bridge_plane
      node_id: device_bridge_plane
      source: device_bridges/* + mcp_tools/*
      contract:
      - printer.prepare
      - lerobot.rollout.start
      - lerobot.rollout.stop
      - equipment.pyautogui.run
      - cae.run_static_analysis
    - id: knowledge_memory_evolution
      node_id: memory_evidence_plane
      source: knowledge/* + self_evolution/* + memory/knowledge
      contract:
      - experiment_evidence.v1
      - bo_observation.v1
      - evolution_proposal.v1
    device_bridges:
    - id: prusa_bridge
      label: Prusa MK4S / PrusaLink
      workspace: /printer
      tools:
      - printer.prepare
      config: memory/prusa_connection.json + memory/prusa_print_profile.json
      live_boundary: upload/start/status/ejection through PrusaLink and PrusaSlicer
        bridge
    - id: lerobot_bridge
      label: LeRobot / Pi0.5 Rollout
      workspace: /lerobot
      tools:
      - lerobot.teleoperate.start
      - lerobot.record.start
      - lerobot.rollout.start
