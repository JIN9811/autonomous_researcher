graph:
  id: utm_test_flow
  name: UTM Test and Analysis Graph
  version: 0.1.0
  entry_node: dispatch
  finish_nodes:
  - step_complete
  nodes:
  - id: dispatch
    label: Runtime Dispatch
    handler: runtime.dispatch
    stage: null
    kind: runtime
    description: Routes lab-equipment test state into UTM and analysis.
    module_id: null
    metadata: {icon: orchestrator}
    position: {x: 32, y: 112}
  - id: idle
    label: Idle
    handler: runtime.idle
    stage: idle
    kind: runtime
    description: Starts lab equipment test flow.
    module_id: null
    metadata: {icon: play}
    position: {x: 224, y: 112}
  - id: equipment
    label: Lab Equipment Agent
    handler: agent.equipment_agent
    stage: equipment
    kind: agent
    description: Runs Windows PyAutoGUI/UTM protocol bridge.
    module_id: modules/equipment
    metadata: {icon: equipment_agent}
    position: {x: 416, y: 64}
  - id: analysis
    label: Analysis Agent
    handler: agent.analysis_agent
    stage: analysis
    kind: agent
    description: Parses UTM data and computes metrics/CAE context.
    module_id: modules/analysis
    metadata: {icon: analysis_agent}
    position: {x: 608, y: 64}
  - id: knowledge
    label: Knowledge Agent
    handler: agent.knowledge_agent
    stage: knowledge
    kind: agent
    description: Stores summarized test result context for future BO.
    module_id: modules/knowledge
    metadata: {icon: knowledge_agent}
    position: {x: 800, y: 64}
  - id: complete
    label: Complete
    handler: runtime.terminal
    stage: complete
    kind: terminal
    description: UTM flow finished.
    module_id: null
    metadata: {icon: complete}
    position: {x: 992, y: 64}
  - id: error
    label: Error
    handler: runtime.terminal
    stage: error
    kind: terminal
    description: UTM flow failed.
    module_id: null
    metadata: {icon: error}
    position: {x: 992, y: 192}
  - id: step_complete
    label: Step Complete
    handler: runtime.step_complete
    stage: null
    kind: runtime
    description: One-step boundary for runtime invocation.
    module_id: null
    metadata: {icon: artifact}
    position: {x: 32, y: 304}
  edges:
  - {source: dispatch, target: idle, condition: idle, label: current stage is idle, metadata: {}}
  - {source: dispatch, target: equipment, condition: equipment, label: '', metadata: {}}
  - {source: dispatch, target: analysis, condition: analysis, label: '', metadata: {}}
  - {source: dispatch, target: knowledge, condition: knowledge, label: '', metadata: {}}
  - {source: dispatch, target: complete, condition: complete, label: '', metadata: {}}
  - {source: dispatch, target: error, condition: error, label: '', metadata: {}}
  - {source: idle, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: equipment, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: analysis, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: knowledge, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: complete, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: error, target: step_complete, condition: null, label: '', metadata: {}}
  - source: idle
    target: equipment
    condition: null
    label: 'configured transition: idle -> equipment'
    metadata: {runtime_edge: logical_transition, from_stage: idle, to_stage: equipment}
  - source: equipment
    target: analysis
    condition: null
    label: 'configured transition: equipment -> analysis'
    metadata: {runtime_edge: logical_transition, from_stage: equipment, to_stage: analysis}
  - source: analysis
    target: knowledge
    condition: null
    label: 'configured transition: analysis -> knowledge'
    metadata: {runtime_edge: logical_transition, from_stage: analysis, to_stage: knowledge}
  - source: knowledge
    target: complete
    condition: null
    label: 'configured transition: knowledge -> complete'
    metadata: {runtime_edge: logical_transition, from_stage: knowledge, to_stage: complete}
  stage_dispatch: {idle: idle, equipment: equipment, analysis: analysis, knowledge: knowledge, complete: complete, error: error}
  transitions: {idle: equipment, equipment: analysis, analysis: knowledge, knowledge: complete}
  terminal_stages: [complete, error]
  metadata:
    runtime: langgraph
    template: utm_test_flow
    workspace: equipment
    executable_from_runtime_ide: false
    safety: {guardian_required: false, live_device_dry_run_required_before_execution: true}
