module:
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: []
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: no generic required output keys
  id: bo
  label: BO Agent Module
  handler: agent.bo_agent
  llm_role: bo_policy
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - experiment.benchmark
  internal_graph:
    - id: 01_load_analysis_handoff
      label: Load Analysis Handoff
      kind: internal_step
    - id: 02_filter_valid_priors
      label: Filter Valid Priors
      kind: internal_step
    - id: 03_summarize_evidence_table
      label: Summarize Evidence Table
      kind: internal_step
    - id: 04_llm_reasoning_hypothesis_pass
      label: LLM Strategy And Tool Decision
      kind: internal_step
    - id: 05_validate_reasoning_patch
      label: Validate Tool Request And Evidence
      kind: internal_step
    - id: 06_update_search_space
      label: Freeze Search Contract
      kind: internal_step
    - id: 07_generate_candidate_pool
      label: Dispatch Numeric Optimizer
      kind: internal_step
    - id: 08_score_numeric_acquisition
      label: Read Numeric Acquisition
      kind: internal_step
    - id: 09_score_llm_preference
      label: Inspect Numerical Diagnostics
      kind: internal_step
    - id: 10_apply_constraint_and_failure_penalties
      label: Check Candidate Integrity
      kind: internal_step
    - id: 11_rank_top_k_candidates
      label: Preserve Solver Recommendation
      kind: internal_step
    - id: 12_llm_top_k_critique
      label: LLM Result Review
      kind: internal_step
    - id: 13_select_recommendation
      label: Accept Or Return Recommendation
      kind: internal_step
    - id: 14_write_bo_artifacts
      label: Write BO Artifacts
      kind: internal_step
    - id: 15_handoff_design_constraints
      label: Handoff Design Constraints
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. Python source is not modified by the GUI. BO
    local High selects bounded strategy/evidence tools and reviews the numeric
    result. LHS/BoTorch own coordinates; local tool names are not global bridge
    tools. Legacy internal IDs remain display/checkpoint identities. Existing
    Guardian/Orchestrator and downstream device ownership are unchanged.

  metadata:
    control_view:
      areas:
        internal_graph:01_load_analysis_handoff: knowledge
        internal_graph:02_filter_valid_priors: guardian
        internal_graph:03_summarize_evidence_table: knowledge
        internal_graph:04_llm_reasoning_hypothesis_pass: high
        internal_graph:05_validate_reasoning_patch: guardian
        internal_graph:06_update_search_space: middle
        internal_graph:07_generate_candidate_pool: middle
        internal_graph:08_score_numeric_acquisition: middle
        internal_graph:09_score_llm_preference: middle
        internal_graph:10_apply_constraint_and_failure_penalties: guardian
        internal_graph:11_rank_top_k_candidates: middle
        internal_graph:12_llm_top_k_critique: high
        internal_graph:13_select_recommendation: middle
        internal_graph:14_write_bo_artifacts: knowledge
        internal_graph:15_handoff_design_constraints: middle
      llm_steps:
      - internal_graph:04_llm_reasoning_hypothesis_pass
      - internal_graph:12_llm_top_k_critique
      empty_roles:
        low: No direct device execution in this agent
