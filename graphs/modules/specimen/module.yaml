module:
  id: specimen
  label: Specimen Making Module
  handler: agent.specimen_agent
  llm_role: tool_formatting
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - geometry.generate_metamaterial_stl
  - geometry.check_mesh_quality
  - geometry.check_manufacturability
  - artifact.create_specimen_handoff
  - experiment.evaluate
  - printer.prepare
  internal_graph:
    - id: 01_spec_intake
      label: Spec Intake / Required Field Gate
      kind: internal_step
    - id: 02_resolve_fabrication_intent
      label: Resolve Fabrication Intent
      kind: internal_step
    - id: 03_initialize_digital_thread
      label: Initialize Manufacturing Digital Thread
      kind: internal_step
    - id: 04_generate_geometry_stl
      label: Generate Geometry STL
      kind: internal_step
    - id: 05_mesh_dimensional_qa
      label: Mesh and Dimensional QA
      kind: internal_step
    - id: 06_printability_process_plan
      label: Printability and Process Planning
      kind: internal_step
    - id: 07_slice_gcode_qa
      label: Slicing and G-code QA
      kind: internal_step
    - id: 08_execution_gate
      label: Execution Gate / Virtual or Live Bridge
      kind: internal_step
    - id: 09_fabrication_monitoring
      label: Fabrication Monitoring Evidence
      kind: internal_step
    - id: 10_repair_or_stop_decision
      label: Repair or Stop Decision
      kind: internal_step
    - id: 11_handoff_vision_manipulation
      label: Specimen Fabricated Handoff
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. Python source is not modified by the GUI.
