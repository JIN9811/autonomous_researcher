module:
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: ["guardian"]
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: existing guardian decision controls stop/error/continue routes
  id: guardian
  label: Guardian Agent Module
  handler: agent.guardian_agent
  llm_role: guardian_review
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - device.health
  - experiment.queue.status
  internal_graph:
    - id: 01_check_safety_gates
      label: Check Safety Gates
      kind: internal_step
    - id: 02_review_recent_failures
      label: Review Recent Failures
      kind: internal_step
    - id: 03_decide_continue_stop_error
      label: Decide Continue Stop Error
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. Python source is not modified by the GUI.

  metadata:
    control_view:
      areas:
        internal_graph:01_check_safety_gates: guardian
        internal_graph:02_review_recent_failures: knowledge
        internal_graph:03_decide_continue_stop_error: guardian
      empty_roles:
        low: No direct device execution in this agent
      checkpoint_details:
        internal_graph:02_review_recent_failures:
          nodes:
          - id: review
            label: "LLM policy evidence review"
            area: high
            source: {path: agents/guardian_agent.py, symbol: GuardianAgent.run}
          edges:
          - {source: $operation, target: review, kind: evidence, label: "existing internal decision"}
