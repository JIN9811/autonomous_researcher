module:
  id: guardian
  label: Guardian Agent Module
  handler: agent.guardian_agent
  llm_role: guardian_review
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - device.health
  - experiment.queue.status
  local_decision_tools:
  - guardian.evidence.read
  - guardian.failures.read
  - guardian.decision.submit
  decision_contract:
    schema: guardian_evidence_decision.v1
    actions:
    - continue
    - review
    - safe_stop
    max_turns_default: 6
    call_timeout_s_default: 120
    total_timeout_s_default: 300
    authority: read_only_evidence_review
  internal_graph:
    - id: 01_check_safety_gates
      label: Check Safety Gates
      kind: internal_step
    - id: 02_review_recent_failures
      label: Review Recent Failures
      kind: internal_step
    - id: 03_decide_continue_stop_error
      label: Decide Continue Stop Error
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. Python source is not modified by the GUI.
