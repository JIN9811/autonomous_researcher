module:
  implementation:
    schema: ax4lab.agent_module.v1
    id: design
    version: 1.0.0
    registration: installed_code
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: ["experiment_spec"]
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: experiment_spec may be absent for a valid blocked design_decision envelope
  id: design
  label: Design Agent Module
  handler: agent.design_agent
  llm_role: design_reasoning
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools: []
  pre_execution:
    - id: orchestrator_plan
      label: Orchestrator Planning
      kind: pre_stage
      handler: agent.orchestrator_agent
      output_key: orchestrator_plan
      event_type: orchestrator_plan
      enabled: true
  execution_graph:
    schema: ax4lab.execution_graph.v1
    entry: prepare
    nodes:
    - id: prepare
      handler: design.prepare
      label: Prepare candidates and evidence
      area: middle
    - id: decide
      handler: design.decide
      label: Composite bounded suitability decision
      area: middle
      llm: true
    - id: finalize
      handler: design.finalize
      label: Finalize accepted design and Specimen handoff
      area: middle
    - id: owner_review
      handler: design.review_result
      label: Return review-required result
      area: guardian
    edges:
    - {source: prepare, target: decide, 'on': next, kind: execution}
    - {source: decide, target: finalize, 'on': accepted, kind: execution}
    - {source: decide, target: owner_review, 'on': blocked, kind: validation}
    terminals: [finalize, owner_review]
  io_contract:
    input: OrchestratorState with objective, constraints, prior_context, bo_result, knowledge, and failure_memory
    output: AgentResult.data with experiment_spec, design_report, design_candidate, candidate_ledger, decisions, metrics, and handoff_packet
  metadata:
    control_view:
      empty_roles:
        low: No direct device execution; fabrication belongs to Specimen
        knowledge: Source context and result evidence
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. The Design-owned LLM decision layer selects
    inspect_candidate, inspect_history, accept_candidate, or return_to_owner
    through a local schema-validated dispatcher (not global device tools).
    Existing computation, locked parameters, hard checks and handoff remain
    code-owned. Legacy proxy scores are compatibility fields, not model evidence.
