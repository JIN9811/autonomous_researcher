module:
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: []
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: no generic required output keys
  id: knowledge
  label: Knowledge Agent Module
  handler: agent.knowledge_agent
  llm_role: knowledge_query
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools: []
  internal_graph:
    - id: 01_collect_run_artifacts
      label: Collect Run Artifacts
      kind: internal_step
    - id: 02_normalize_provenance
      label: Normalize Provenance
      kind: internal_step
    - id: 03_ingest_agent_reports
      label: LLM Evidence Inspection And Scoped Retrieval
      kind: internal_step
    - id: 04_write_experiment_knowledge_record
      label: Classify And Write Markdown Knowledge
      kind: internal_step
    - id: 05_update_failure_patterns
      label: Update Failure Patterns
      kind: internal_step
    - id: 06_update_success_patterns
      label: Update Success Patterns
      kind: internal_step
    - id: 07_update_agent_performance_ledger
      label: Update Agent Performance Ledger
      kind: internal_step
    - id: 08_build_bo_context
      label: Build BO Context
      kind: internal_step
    - id: 09_rank_self_evolution_targets
      label: Rank Self-Evolution Targets
      kind: internal_step
    - id: 10_build_evolution_evidence_packs
      label: Build Evolution Evidence Packs
      kind: internal_step
    - id: 11_emit_knowledge_report
      label: Emit Knowledge Report
      kind: internal_step
    - id: 12_emit_evolution_lab_prefill
      label: Emit Evolution Lab Prefill
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data with knowledge_context.v1 and evolution_proposal.v1
  output_contracts:
    - knowledge_context.v1
    - evolution_proposal.v1
    - knowledge_report.v1
    - experiment_knowledge_v1
    - agent_performance_v1
    - failure_pattern_v1
    - success_pattern_v1
    - evolution_evidence_pack_v1
  transition_conditions:
    - knowledge_record exists
    - provenance.used is non-empty
    - agent_performance_records exist for completed stages
    - bo_context exists or explicit no_bo_context_needed reason exists
    - evolution_evidence_packs exists or explicit no_evolution_needed reason exists
  notes: >-
    Knowledge is the research memory and self-evolution evidence owner. It writes
    typed run artifacts plus memory/knowledge JSONL and ontology-guided Markdown
    records. The normal knowledge_query LLM selects local inspect_evidence,
    search_knowledge, read_knowledge, write_knowledge_note and publish_context
    actions. Those actions are agent-local, not bridge tools. Knowledge graph
    storage and reconciliation are retired. Original scientific values,
    manual citations, ontology and executable graph remain unchanged.
    Evolution evidence is preserved; variants are never directly activated.

  metadata:
    control_view:
      areas:
        internal_graph:01_collect_run_artifacts: knowledge
        internal_graph:02_normalize_provenance: guardian
        internal_graph:03_ingest_agent_reports: high
        internal_graph:04_write_experiment_knowledge_record: knowledge
        internal_graph:05_update_failure_patterns: knowledge
        internal_graph:06_update_success_patterns: knowledge
        internal_graph:07_update_agent_performance_ledger: knowledge
        internal_graph:08_build_bo_context: middle
        internal_graph:09_rank_self_evolution_targets: middle
        internal_graph:10_build_evolution_evidence_packs: knowledge
        internal_graph:11_emit_knowledge_report: knowledge
        internal_graph:12_emit_evolution_lab_prefill: middle
      llm_steps:
      - internal_graph:03_ingest_agent_reports
      empty_roles:
        low: No direct device execution in this agent
