module:
  id: equipment
  label: Lab Equipment Agent Module
  handler: agent.equipment_agent
  llm_role: tool_formatting
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - equipment.pyautogui.health
  - equipment.pyautogui.list_programs
  - equipment.pyautogui.run
  - utm.run_protocol
  internal_graph:
    - id: 01_resolve_equipment_profile
      label: Resolve Exact Equipment Profile or Skill Version
      kind: internal_step
    - id: 02_validate_bridge_contract
      label: Validate Bridge and Skill Contract
      kind: internal_step
    - id: 03_execute_registered_protocol
      label: Execute Deterministic Program Segments
      kind: internal_step
    - id: 04_exception_recovery_gate
      label: Bound Exception Recovery Through Guardian
      kind: internal_step
    - id: 05_validate_evidence_handoff
      label: Validate Evidence and Handoff
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    GUI/module editor may edit this module config, but execution remains bound to
    allowlisted Python handlers. Python source is not modified by the GUI.
