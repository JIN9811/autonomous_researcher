module:
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: ["equipment_result","protocol_note"]
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: existing conditional CSV, handoff and status predicates remain authoritative
  id: equipment
  label: Lab Equipment Agent Module
  handler: agent.equipment_agent
  llm_role: equipment_workflow_decision
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - equipment.pyautogui.health
  - equipment.pyautogui.list_programs
  - equipment.pyautogui.run
  - equipment.pyautogui.screenshot
  - equipment.pyautogui.request_log
  - vision.equipment_cross_check
  - utm.run_protocol
  workflow_agentic_tasks:
    - id: run_utm_compression_cycle
      label: UTM Compression Cycle
      scope: profile_bound_equipment_skill_flow
      entry_gate:
        id: verified_specimen_utm_handoff
        required: true
        locked: true
        expected_status: ready_for_equipment
      value_channels:
        - Force
        - Stroke
        - Height
      block_order:
        - prepare_next_specimen
        - start_test
        - monitor_contact_and_run
        - await_auto_return
        - save_raw_data
        - validate_raw_data
        - advance_without_save
        - restore_robot_clearance
      vision_policy: optional_per_block
  execution_graph:
    schema: ax4lab.execution_graph.v1
    entry: task
    nodes:
    - {id: task, handler: equipment.task, label: Composite bounded equipment task, area: middle, llm: true}
    - {id: deliver, handler: equipment.deliver, label: Deliver owner result, area: middle}
    edges:
    - {source: task, target: deliver, 'on': next, kind: evidence}
    terminals: [deliver]
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    run_utm_compression_cycle is an additive workflow-level supervisor above the
    existing Profile-bound Equipment Skill Flow. Its upstream ready_for_equipment
    handoff is mandatory and has no enable switch. Each existing block retains its
    exact Skill binding, bounded routes, and optional Vision switch. Method and cell
    configuration supply Force, Stroke, Height, and clearance values at runtime;
    this module declares no recorded numeric defaults. GUI/module editor may edit
    this module config, but execution remains bound to allowlisted Python handlers.
    Python source is not modified by the GUI.
    The Equipment-owned decision boundary selects the configured stacked Flow and
    reviews screenshots and evidence after terminal completion or failure. It does
    not interrupt running blocks; existing Vision and safety gates remain active.
