module:
  id: vision
  label: Vision Agent Module
  handler: agent.vision_agent
  llm_role: vision_observation
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
    stale_signal_blocks_downstream: true
  tools:
  - lerobot.replay.status
  - lerobot.replay.stop
  - camera.capture
  - lerobot.camera.test
  - lerobot.active_robot_cam.capture
  - lerobot.rollout.status
  - lerobot.rollout.stop
  - vision.utm_runtime.start
  - vision.utm_specimen_presence.capture
  internal_graph:
    - id: 01_observation_task_resolve
      label: Observation Task Resolve
      kind: internal_step
    - id: 02_zone_registry_load
      label: Zone Registry Load
      kind: internal_step
    - id: 03_capture_scene
      label: Capture Scene
      kind: internal_step
    - id: 03_active_robot_cam_ejection_check
      label: Active robot camera ejection check
      kind: tool_step
      tool: lerobot.active_robot_cam.capture
      emits:
      - active_cam_ejection_check.v1
      - spc_autoejection_confirmation.v1
    - id: 04_perception_backend
      label: Perception Backend / Simulator Degrade
      kind: internal_step
    - id: 05_estimate_scene_state
      label: Estimate Scene State
      kind: internal_step
    - id: 06_detect_temporal_events
      label: Detect Temporal Events
      kind: internal_step
    - id: 07_arbitrate_agent_signals
      label: Arbitrate Agent Signals
      kind: internal_step
    - id: 08_package_visual_evidence
      label: Package Visual Evidence
      kind: internal_step
    - id: 09_handoff_signal_bus
      label: Handoff vision_signal.v1
      kind: internal_step
    - id: 10_stop_verified_rollout
      label: Stop rollout after verified UTM placement
      kind: tool_step
      tool: lerobot.rollout.stop
      emits:
      - vision_manipulation_completion.v1
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
    preserves:
    - observation.pose_estimate
    - observation.pickup_target
    - observation.transfer_readiness
    produces:
    - vision_report.v1
    - vision_signal.v1
    - decisions
    - metrics
    - evidence_refs
  notes: >-
    Vision Agent observes and emits freshness-bounded lab perception signals. It
    may stop the active robot rollout only after UTM placement is verified; it
    does not start robot motion or command printer, UTM, or PyAutoGUI actions.
    Downstream agents must reject stale `vision_signal.v1` signals whose
    `expires_at` has passed.
