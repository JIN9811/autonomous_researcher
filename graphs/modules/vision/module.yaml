module:
  id: vision
  label: Vision Agent Module
  handler: agent.vision_agent
  llm_role: vision_observation
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
    stale_signal_blocks_downstream: true
  tools:
  - camera.capture
  - vision.specimen_pose_snapshot
  - vision.specimen_pose.release
  internal_graph:
    - id: 01_observation_task_resolve
      label: Observation Task Resolve
      kind: internal_step
    - id: 02_zone_registry_load
      label: Zone Registry Load
      kind: internal_step
    - id: 03_capture_scene
      label: Capture Scene
      kind: internal_step
    - id: 03a_acquire_d455f_lease
      label: Acquire D455F lease from VLA route
      kind: tool_step
      tool: vision.specimen_pose_snapshot
      emits:
      - camera_lease
    - id: 03b_one_shot_specimen_pose
      label: One-shot D455F RGB-D specimen pose snapshot
      kind: internal_step
      emits:
      - specimen_pose.v1
    - id: 03c_release_d455f_to_vla
      label: Confirm D455F returned to VLA route
      kind: handoff_gate
      emits:
      - camera_returned_to_vla
    - id: 04_perception_backend
      label: Perception Backend / Simulator Degrade
      kind: internal_step
    - id: 05_estimate_scene_state
      label: Estimate Scene State
      kind: internal_step
    - id: 06_detect_temporal_events
      label: Detect Temporal Events
      kind: internal_step
    - id: 07_arbitrate_agent_signals
      label: Arbitrate Agent Signals
      kind: internal_step
    - id: 08_package_visual_evidence
      label: Package Visual Evidence
      kind: internal_step
    - id: 09_handoff_signal_bus
      label: Handoff vision_signal.v1
      kind: internal_step
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
    preserves:
    - observation.pose_estimate
    - observation.pickup_target
    - observation.transfer_readiness
    produces:
    - vision_report.v1
    - vision_signal.v1
    - specimen_pose.v1
    - decisions
    - metrics
    - evidence_refs
  notes: >-
    Vision Agent observes and emits freshness-bounded lab perception signals. It
    never directly commands printer, robot, UTM, or PyAutoGUI actions. Downstream
    agents must reject stale `vision_signal.v1` signals whose `expires_at` has
    passed.
