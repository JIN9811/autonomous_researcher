ui:
  short: ANL
  icon: /static/live_gui_icons/analysis_agent.svg
  report_title: Analysis Agent
  chat:
    mode: open_on_demand
  renderer:
    dashboard: module
    report: module
    fallback: descriptor
  cards:
  - {id: analysis_objective, type: metric_group, title: Objective, span: 12, tone: analysis}
  - {id: analysis_measured_response, type: chart, title: Measured Response, span: 12, tone: analysis}
  - {id: analysis_key_metrics, type: metric_group, title: Key Metrics, span: 12, tone: analysis}
  - {id: analysis_progress, type: evidence, title: Agentic Progress, span: 12, tone: analysis}
  - {id: analysis_handoff, type: handoff, title: Data Quality & BO Handoff, span: 12, tone: analysis}
  report_sections:
  - id: analysis_evidence
    title: Analysis Evidence
    selectors:
      analysis: latest_analysis
      handoff: metadata.analysis_bo_handoff
      metrics: metadata.analysis_metrics
