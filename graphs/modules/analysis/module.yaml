module:
  orchestration_contract:
    version: orchestration_contract.v1
    admission:
      authority: existing_owner_and_runtime_validation
      description: Descriptive only; absent evidence is unknown, not ready.
    result:
      required: ["analysis"]
    acceptance:
      authority: policies/validation_policy.py and existing owner validators
      description: analysis must be a mapping and analysis.ok must not be false
  id: analysis
  label: Analysis Agent Module
  handler: agent.analysis_agent
  llm_role: ""
  editable: true
  safety:
    live_requires_validation: true
    dry_run_supported: true
  tools:
  - cae.run_static_analysis
  execution_graph:
    schema: ax4lab.execution_graph.v1
    entry: task
    nodes:
    - id: task
      handler: analysis.task
      label: Composite measured analysis and optional background FEM task
      area: middle
      llm: true
    - id: deliver
      handler: analysis.deliver
      label: Deliver owner result
      area: middle
    edges:
    - {source: task, target: deliver, 'on': next, kind: evidence}
    terminals: [deliver]
  io_contract:
    input: OrchestratorState
    output: AgentResult.data merged into OrchestratorState
  notes: >-
    The executable graph wraps the existing archived owner body once. Actual
    LLM decisions and Middle numerical, CAE, FEM, calibration and improvement
    relationships are source-backed implementation details, not additional
    executable workflow stages. Measured foreground results reach BO without
    awaiting background FEM. The Analysis agent has no physical Low boundary;
    the installed CAE bridge owns computation and retains its existing gates,
    queue, solver settings, and resource lifetime. Python source is not modified
    by the GUI or LLM.
