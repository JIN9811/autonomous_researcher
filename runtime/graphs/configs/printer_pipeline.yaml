graph:
  id: printer_pipeline
  name: 3DP Printer Pipeline Graph
  version: 0.1.0
  entry_node: dispatch
  finish_nodes:
  - step_complete
  nodes:
  - id: dispatch
    label: Runtime Dispatch
    handler: runtime.dispatch
    stage: null
    kind: runtime
    description: Routes printer workspace state into the specimen-making pipeline.
    module_id: null
    metadata: {icon: orchestrator}
    position: {x: 32, y: 112}
  - id: idle
    label: Idle
    handler: runtime.idle
    stage: idle
    kind: runtime
    description: Starts the printer preparation pipeline.
    module_id: null
    metadata: {icon: play}
    position: {x: 224, y: 112}
  - id: specimen
    label: Specimen Making / Printer
    handler: agent.specimen_agent
    stage: specimen
    kind: agent
    description: Generates/slices/uploads or simulates printer-ready specimen artifacts.
    module_id: modules/specimen
    metadata: {icon: specimen_maker}
    position: {x: 416, y: 112}
  - id: complete
    label: Complete
    handler: runtime.terminal
    stage: complete
    kind: terminal
    description: Printer pipeline finished.
    module_id: null
    metadata: {icon: complete}
    position: {x: 608, y: 64}
  - id: error
    label: Error
    handler: runtime.terminal
    stage: error
    kind: terminal
    description: Printer pipeline failed.
    module_id: null
    metadata: {icon: error}
    position: {x: 608, y: 192}
  - id: step_complete
    label: Step Complete
    handler: runtime.step_complete
    stage: null
    kind: runtime
    description: One-step boundary for runtime invocation.
    module_id: null
    metadata: {icon: artifact}
    position: {x: 32, y: 304}
  edges:
  - {source: dispatch, target: idle, condition: idle, label: current stage is idle, metadata: {}}
  - {source: dispatch, target: specimen, condition: specimen, label: '', metadata: {}}
  - {source: dispatch, target: complete, condition: complete, label: '', metadata: {}}
  - {source: dispatch, target: error, condition: error, label: '', metadata: {}}
  - {source: idle, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: specimen, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: complete, target: step_complete, condition: null, label: '', metadata: {}}
  - {source: error, target: step_complete, condition: null, label: '', metadata: {}}
  - source: idle
    target: specimen
    condition: null
    label: 'configured transition: idle -> specimen'
    metadata: {runtime_edge: logical_transition, from_stage: idle, to_stage: specimen}
  - source: specimen
    target: complete
    condition: null
    label: 'configured transition: specimen -> complete'
    metadata: {runtime_edge: logical_transition, from_stage: specimen, to_stage: complete}
  stage_dispatch: {idle: idle, specimen: specimen, complete: complete, error: error}
  transitions: {idle: specimen, specimen: complete}
  terminal_stages: [complete, error]
  metadata:
    runtime: langgraph
    template: printer_pipeline
    workspace: printer
    executable_from_runtime_ide: false
    safety: {guardian_required: false, live_device_dry_run_required_before_execution: true}
